---
layout: default
---
<section class="hero">
  <div class="wrapper">
    <h1>{{ page.title }}</h1>
    <p>{{ content }}</p>
  </div>
</section>

{% include filters.html %}

{% assign stories = site.stories | sort: "date" | reverse %}

<div class="wrapper">
  <ul class="story-grid" data-story-grid data-page-size="9">
    {% for story in stories %}
      {% include story-card.html story=story %}
    {% endfor %}
  </ul>

  <p class="no-results" data-no-results hidden>
    No stories match your filters. Try resetting them.
  </p>

  <nav class="pagination" data-pagination aria-label="Stories pages" hidden></nav>
</div>
